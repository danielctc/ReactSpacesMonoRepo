<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vite + React</title>

  <style>
    /* Tailwind CSS container styles recreated */
    .container {
      width: 100%;
      padding-right: 1rem;
      padding-left: 1rem;
      margin-right: auto;
      margin-left: auto;
    }

    @media (min-width: 640px) {
      .container {
        max-width: 640px;
      }
    }

    @media (min-width: 768px) {
      .container {
        max-width: 768px;
      }
    }

    @media (min-width: 1024px) {
      .container {
        max-width: 1024px;
      }
    }

    @media (min-width: 1280px) {
      .container {
        max-width: 1280px;
      }
    }
  </style>

  <!-- Unity-React Bridge: Dispatches events to react-unity-webgl -->
  <script>
    (function() {
      // Event queue for debugging
      window.__UNITY_EVENT_QUEUE__ = [];

      // dispatchReactUnityEvent - called by Unity jslib
      // react-unity-webgl v10+ creates this function when Unity loads
      // This polyfill handles events that arrive before Unity fully loads
      window.dispatchReactUnityEvent = function(eventName, eventData) {
        console.log('[Unity Bridge] Event:', eventName, eventData ? '(with data)' : '');

        // Queue for debugging
        window.__UNITY_EVENT_QUEUE__.push({ name: eventName, data: eventData, time: Date.now() });
        if (window.__UNITY_EVENT_QUEUE__.length > 50) window.__UNITY_EVENT_QUEUE__.shift();

        // Dispatch as CustomEvent - react-unity-webgl addEventListener hooks into this
        var event = new CustomEvent(eventName, { detail: eventData });
        window.dispatchEvent(event);
      };

      console.log('[Unity Bridge] Polyfill ready');
    })();
  </script>
</head>

<body>
  <!--dantest - Local Development Build-->
  <div id="root" data-space-id="dantest" data-theme="default">
    <div id="header-auth-root" data-space-id="dantest" data-theme="default"></div>
    <div class="container" style="border: 1px solid red;">
      <div id="webgl-root" data-space-id="dantest" data-theme="default" style="width: 100%; height: 100%;">
      </div>
      <div id="chat-root" data-space-id="dantest" data-theme="default"></div>
    </div>
  </div>

  <!-- Full application -->
  <script type="module" src="/src/main.tsx"></script>


</body>

</html>
